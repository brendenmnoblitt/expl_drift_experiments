[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "expl-drift-endpoint"
version = "0.1.0"
description = "Remote classifier extraction service for expl_drift experiments"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.115.12",
  "pydantic==2.11.7",
  "uvicorn==0.34.3",
]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==9.0.2", "ruff==0.12.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/expl_drift_endpoint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
