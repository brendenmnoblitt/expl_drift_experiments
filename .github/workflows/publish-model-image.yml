name: Publish Laya model-runtime image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-model-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      IMAGE_NAME: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/expl-drift-laya-endpoint
    steps:
      - name: Check out the selected source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate source revision and image tag
        id: source
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          test "$commit" = "$GITHUB_SHA"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "tag=$commit" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Docker Hub
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish model-runtime target
        id: push
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: ./endpoint
          file: ./endpoint/Dockerfile
          target: model-runtime
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.source.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.commit }}
            org.opencontainers.image.version=${{ steps.source.outputs.commit }}
            org.opencontainers.image.title=expl_drift Laya model-runtime endpoint
          cache-from: type=gha,scope=laya-model-runtime
          cache-to: type=gha,mode=max,scope=laya-model-runtime
          provenance: true
          sbom: true

      - name: Record immutable image reference
        env:
          IMAGE_REPOSITORY: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ env.IMAGE_NAME }}:${{ steps.source.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          {
            echo '### Published Laya model-runtime image'
            echo
            echo "- Commit: \`$SOURCE_COMMIT\`"
            echo "- Tag: \`$IMAGE_TAG\`"
            echo "- Immutable reference: \`${IMAGE_REPOSITORY}@${IMAGE_DIGEST}\`"
            echo "- Digest: \`$IMAGE_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Image digest: $IMAGE_DIGEST"
